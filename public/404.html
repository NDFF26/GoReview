<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GoReview - Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // SPA Fallback for GitHub Pages static hosting
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        var userIdx = path.toLowerCase().indexOf('/user/');
        var adminIdx = path.toLowerCase().indexOf('/admin');

        if (userIdx !== -1) {
          var base = path.substring(0, userIdx);
          var subPath = path.substring(userIdx);
          window.location.replace((base || '') + '/#' + subPath + search + hash);
        } else if (adminIdx !== -1) {
          var base = path.substring(0, adminIdx);
          var subPath = path.substring(adminIdx);
          window.location.replace((base || '') + '/#' + subPath + search + hash);
        } else {
          var cleanBase = path.replace(/\/$/, '');
          window.location.replace((cleanBase || '') + '/#' + search + hash);
        }
      })();
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p>Redirecting to GoReview...</p>
    </div>
  </body>
</html>
